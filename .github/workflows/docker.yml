name: Docker - Construir probar y publicar

on:
  push:
    branches: [docker-deploy]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/obed336/render-flask-sue

jobs:
  construir-probar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Construir imagen Docker
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Probar respuesta de la aplicacion
        run: |
          docker run -d --name prueba-flask \
            -p 127.0.0.1:8080:8000 "$IMAGE:$GITHUB_SHA"

          for intento in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > respuesta.txt; then
              cat respuesta.txt
              echo ""
              echo "Prueba HTTP correcta"
              exit 0
            fi
            sleep 2
          done

          docker logs prueba-flask
          exit 1

      - name: Iniciar sesion en el registro
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Publicar imagen verificada
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:docker-deploy"
          docker push "$IMAGE:docker-deploy"

      - name: Limpiar contenedor de prueba
        if: always()
        run: docker rm -f prueba-flask || true
